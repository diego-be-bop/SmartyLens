name: Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    # Debian 12: glibc 2.36, cosi' il file gira su Debian 12+, Ubuntu 24.04+, Fedora 37+
    container: debian:12
    timeout-minutes: 15
    steps:
      - name: Dipendenze
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates gcc libc6-dev pkg-config libgtk-3-dev libcurl4-openssl-dev \
            xvfb xauth xdotool xclip imagemagick x11-utils procps fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Compilazione
        run: sh build_linux.sh
      - name: Prova della ricerca
        run: |
          ./smartylens --test "np.linspace(0, 1, 5)" | tee out.txt
          grep -q "titolo=numpy.linspace" out.txt
      - name: Prova dell'interfaccia
        run: SHOT=$PWD/schermata.png xvfb-run -a -s "-screen 0 1280x800x24" bash tests/linux_gui_test.sh
      - name: Pacchetto
        run: cp smartylens smartylens-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: smartylens-linux-x86_64
          path: |
            smartylens-linux-x86_64
            schermata.png
      - name: Allegato alla release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: smartylens-linux-x86_64
