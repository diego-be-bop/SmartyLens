name: Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libgtk-3-dev libcurl4-openssl-dev xvfb xdotool xclip imagemagick x11-utils
      - name: Compilazione
        run: sh build_linux.sh
      - name: Prova della ricerca
        run: |
          ./smartylens --test "np.linspace(0, 1, 5)" | tee out.txt
          grep -q "titolo=numpy.linspace" out.txt
      - name: Prova dell'interfaccia
        run: SHOT=$PWD/schermata.png xvfb-run -a -s "-screen 0 1280x800x24" bash tests/linux_gui_test.sh
      - name: Pacchetto
        run: cp smartylens smartylens-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: smartylens-linux-x86_64
          path: |
            smartylens-linux-x86_64
            schermata.png
      - name: Allegato alla release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" smartylens-linux-x86_64 --clobber
